; dgVoodoo2 configuration for Jane's Fighters Anthology
; Generated by dgVoodooCpl and tuned for FA by fa-launcher.
;
; BEFORE THIS FILE DOES ANYTHING you must download dgVoodoo2 and copy one DLL:
;
;   Download : http://dege.freeweb.hu/dgVoodoo2/dgVoodoo2/
;   Copy this: <archive>\MS\x86\DDraw.dll
;   Into here: <your FA install dir>\DDraw.dll
;
; Windows will load the local DDraw.dll instead of the system one,
; and dgVoodoo2 will translate DirectDraw calls to Direct3D 11.

Version                              = 0x287

[General]

OutputAPI                            = bestavailable
Adapters                             = all
FullScreenOutput                     = default
; FA controls its own fullscreen mode via DirectDraw exclusive surfaces.
FullScreenMode                       = false
ScalingMode                          = unspecified
ProgressiveScanlineOrder             = false
EnumerateRefreshRates                = false

Brightness                           = 100
Color                                = 100
Contrast                             = 100
InheritColorProfileInFullScreenMode  = true

KeepWindowAspectRatio                = true
; FA manages its own mouse capture in exclusive fullscreen.
CaptureMouse                         = false
CenterAppWindow                      = false
DisableScreenSaver                   = false

[GeneralExt]

DesktopResolution                    =
DesktopBitDepth                      =
DeframerSize                         = 1
ImageScaleFactor                     = 1
CursorScaleFactor                    = 0
DisplayROI                           =
Resampling                           = bilinear
PresentationModel                    = auto
ColorSpace                           = appdriven
; Show watermark for 1 second then hide it (dgVoodooWatermark = false has no
; effect on the DirectDraw path in this version of dgVoodoo2).
WatermarkDisplayDuration             = 1
FreeMouse                            = false
WindowedAttributes                   =
FullscreenAttributes                 =
; Cap at 30 fps -- matches FA's intended framerate and prevents the game
; loop from pegging a CPU core on modern hardware.
FPSLimit                             = 30
Environment                          =
SystemHookFlags                      =

[Glide]

; FA does not use Glide -- pass through so dgVoodoo2 ignores it.
VideoCard                           = voodoo_2
OnboardRAM                          = 8
MemorySizeOfTMU                     = 4096
NumberOfTMUs                        = 2
TMUFiltering                        = appdriven
DisableMipmapping                   = false
Resolution                          = unforced
Antialiasing                        = appdriven

EnableGlideGammaRamp                = true
ForceVerticalSync                   = true
ForceEmulatingTruePCIAccess         = false
16BitDepthBuffer                    = false
3DfxWatermark                       = false
3DfxSplashScreen                    = false
PointcastPalette                    = false
EnableInactiveAppState              = false

[GlideExt]

DitheringEffect                     = pure32bit
Dithering                           = forcealways
DitherOrderedMatrixSizeScale        = 0

[DirectX]

DisableAndPassThru                  = false

VideoCard                           = internal3D
; Amount of emulated VRAM in MB. 256 is well above FA's needs.
VRAM                                = 256
Filtering                           = appdriven
Mipmapping                          = appdriven
KeepFilterIfPointSampled            = false
; Let FA choose its own resolution (640x480x8 palettized).
Resolution                          = unforced
Antialiasing                        = appdriven

; Let FA control fullscreen/windowed mode itself (required for exclusive
; DirectDraw fullscreen).
AppControlledScreenMode             = true
DisableAltEnterToToggleScreenMode   = true

Bilinear2DOperations                = false
PhongShadingWhenPossible            = false
ForceVerticalSync                   = false
dgVoodooWatermark                   = false
FastVideoMemoryAccess               = false
DisableD3DTnLDevice                 = false

[DirectXExt]

AdapterIDType                       =
VendorID                            =
DeviceID                            =
SubsystemID                         =
RevisionID                          =

DefaultEnumeratedResolutions        = all
ExtraEnumeratedResolutions          =
EnumeratedResolutionBitdepths       = all

DitheringEffect                     = high_quality
Dithering                           = forcealways
DitherOrderedMatrixSizeScale        = 0
DepthBuffersBitDepth                = appdriven
Default3DRenderFormat               = auto

MaxVSConstRegisters                 = 256
D3D12BoundsChecking                 = false
NPatchTesselationLevel              = 0
DisplayOutputEnableMask             = 0xffffffff
MSD3DDeviceNames                    = false
RTTexturesForceScaleAndMSAA         = true
SmoothedDepthSampling               = true
DeferredScreenModeSwitch            = false
PrimarySurfaceBatchedUpdate         = false
SuppressAMDBlacklist                = false
